name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "infra/**"
      - "requirements-lambda.txt"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # needed to log into AWS via OIDC, no long-lived keys
  contents: read

# One production apply at a time. Two quick pushes would otherwise run two
# applies in parallel; the second waits instead (it is not cancelled, so the
# last push always ends up deployed).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    # Same lint/test/terraform checks a pull request gets — a direct push to
    # main can't skip them.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Lambda package
        run: |
          mkdir -p build
          cp src/lambda_function.py build/
        # Dependencies (httpx, anthropic) are NOT bundled here — they already ship
        # in a separate Lambda Layer (telegram-summarizer-bot-layer), which Terraform
        # doesn't touch. Adding a new dependency? Update requirements-lambda.txt and
        # rebuild the layer manually (see README).

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::456824039329:role/github-actions-tgbot
          aws-region: eu-central-1
          # Refuse to run if the assumed credentials belong to any other account
          allowed-account-ids: "456824039329"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false
