name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "infra/**"
      - "requirements-lambda.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # needed to log into AWS via OIDC, no long-lived keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lambda package
        run: |
          mkdir -p build
          cp src/lambda_function.py build/
        # Dependencies (httpx, anthropic) are NOT bundled here — they already ship
        # in a separate Lambda Layer (telegram-summarizer-bot-layer), which Terraform
        # doesn't touch. Adding a new dependency? Update requirements-lambda.txt and
        # rebuild the layer manually (see README).

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::456824039329:role/github-actions-tgbot
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve
